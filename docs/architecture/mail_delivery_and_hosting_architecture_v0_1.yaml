    "source_of_truth_order": [
      "production runtime and server configuration",
      "application code and database schema",
      "versioned architecture and workflow documents",
      "dated status snapshots and evidence reports"
    ]
  },
  "scope": {
    "system": "ForPrint Website",
    "covers": [
      "website communication form mail delivery",
      "mail server submission and local delivery",
      "IMAP client configuration",
      "website-hosting and mail-hosting separation",
      "migration and recovery boundaries"
    ],
    "does_not_store": [
      "passwords",
      "private keys",
      "authentication tokens",
      "mailbox contents",
      "raw queue identifiers"
    ]
  },
  "principles": [
    {
      "id": "mail-service-separation",
      "rule": "The website hosting and mail server are separate operational components."
    },
    {
      "id": "verified-tls",
      "rule": "SMTP and IMAP TLS peer verification must remain enabled."
    },
    {
      "id": "authenticated-submission",
      "rule": "The website submits mail through authenticated SMTP submission, not unauthenticated relay."
    },
    {
      "id": "secret-separation",
      "rule": "Runtime secrets stay outside the webroot, outside documentation, and outside Git."
    },
    {
      "id": "evidence-before-change",
      "rule": "Use read-only checks, controlled tests, backups, validation, and rollback for operational changes."
    },
    {
      "id": "stable-contracts",
      "rule": "Use standard protocol contracts and explicit ports rather than provider-specific assumptions."
    }
  ],
